name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q --cov --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  deploy-script:
    name: deploy.sh & compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x deploy.sh
      - name: docker compose config
        run: |
          cp .env.docker.example .env.docker
          sed -i 's/^PUBLICHOST_POSTGRES_PASSWORD=.*/PUBLICHOST_POSTGRES_PASSWORD=ci/' .env.docker
          mkdir -p secrets && printf ci > secrets/cloudflare_dns_api_token
          touch deploy/traefik/dynamic.yml
          docker compose --env-file .env.docker config -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t publichost-backend:ci .
