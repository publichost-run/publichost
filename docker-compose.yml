# PublicHost self-hosted stack. Use ./deploy.sh — it creates .env.docker,
# renders the Traefik config and runs compose with `--env-file .env.docker`
# (the ${...} values below are interpolated from that file).
#
#   clients ── SSH :${PUBLICHOST_EXTERNAL_SSH_PORT} ──▶ publichost (SSH server)
#   browsers ─ HTTPS :443 ─▶ traefik ─┬─ <label>.<domain> ─▶ publichost:8080
#                                     └─ <domain>         ─▶ api:8000
#
# Only traefik (80/443) and the SSH port are published on the host; the HTTP
# proxy, API, Redis and PostgreSQL stay on the internal compose network.
# The compose project name stays the directory name (no `name:` here), so
# existing volumes (host key, database) are kept across upgrades.

services:
  traefik:
    image: ${PUBLICHOST_TRAEFIK_IMAGE:-traefik:v3.7}
    container_name: publichost-traefik
    restart: unless-stopped
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      - --ping=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Tunnels carry long uploads, SSE and WebSockets (WebLogs lives as long
      # as the tunnel): do not cap the total request read time.
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=0
      - --certificatesresolvers.letsencrypt.acme.email=${PUBLICHOST_ACME_EMAIL:?set PUBLICHOST_ACME_EMAIL in .env.docker}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.caserver=${PUBLICHOST_ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
    environment:
      # The token is read from a compose secret, never from the environment
      # of the application containers.
      CF_DNS_API_TOKEN_FILE: /run/secrets/cloudflare_dns_api_token
    secrets:
      - cloudflare_dns_api_token
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - publichost
      - api

  publichost:
    build: .
    image: ${PUBLICHOST_IMAGE:-publichost-backend:latest}
    container_name: publichost
    restart: unless-stopped
    env_file: .env.docker
    ports:
      # SSH goes straight to the container; Traefik never touches it.
      - "${PUBLICHOST_EXTERNAL_SSH_PORT:-2222}:2222"
    environment:
      PUBLICHOST_SSH_HOST: 0.0.0.0
      PUBLICHOST_SSH_PORT: 2222
      PUBLICHOST_HTTP_HOST: 0.0.0.0
      PUBLICHOST_HTTP_PORT: 8080
      PUBLICHOST_HOST_KEY_PATH: /data/host_key
      PUBLICHOST_REDIS_URL: redis://redis:6379/0
      PUBLICHOST_WEBLOGS_PATH: /app/weblogs
    volumes:
      # Host key survives rebuilds. Deleting this volume rotates the key —
      # clients will then see an SSH host-key-changed warning.
      - hostkey:/data
      - weblogs:/app/weblogs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 2222), timeout=3).close()",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  api:
    build: .
    image: ${PUBLICHOST_IMAGE:-publichost-backend:latest}
    container_name: publichost-api
    restart: unless-stopped
    command: ["publichost-api"]
    env_file: .env.docker
    environment: &backend-env
      PUBLICHOST_REDIS_URL: redis://redis:6379/0
      PUBLICHOST_DATABASE_URL: postgresql+asyncpg://${PUBLICHOST_POSTGRES_USER:-publichost}:${PUBLICHOST_POSTGRES_PASSWORD:?set PUBLICHOST_POSTGRES_PASSWORD in .env.docker}@postgres:5432/${PUBLICHOST_POSTGRES_DB:-publichost}
      PUBLICHOST_WEBLOGS_PATH: /app/weblogs
      PUBLICHOST_API_HOST: 0.0.0.0
      PUBLICHOST_API_PORT: 8000
    volumes:
      - weblogs:/app/weblogs
    depends_on: &backend-deps
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    image: ${PUBLICHOST_IMAGE:-publichost-backend:latest}
    container_name: publichost-worker
    restart: unless-stopped
    command: ["publichost-worker"]
    env_file: .env.docker
    environment: *backend-env
    depends_on: *backend-deps

  beat:
    build: .
    image: ${PUBLICHOST_IMAGE:-publichost-backend:latest}
    container_name: publichost-beat
    restart: unless-stopped
    command: ["publichost-beat"]
    env_file: .env.docker
    environment: *backend-env
    depends_on: *backend-deps

  redis:
    image: redis:7-alpine
    container_name: publichost-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: publichost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PUBLICHOST_POSTGRES_USER:-publichost}
      POSTGRES_PASSWORD: ${PUBLICHOST_POSTGRES_PASSWORD:?set PUBLICHOST_POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: ${PUBLICHOST_POSTGRES_DB:-publichost}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 5

secrets:
  cloudflare_dns_api_token:
    file: ./secrets/cloudflare_dns_api_token

volumes:
  hostkey:
  weblogs:
  redisdata:
  pgdata:
  letsencrypt:
