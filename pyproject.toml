[project]
name = "publichost-backend"
version = "0.1.0"
description = "SSH server handing out one-time *.publichost.run subdomains for tunnels to localhost"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.14.2,<3",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "celery>=5.4.0",
    "pydantic-settings>=2.6.0",
    "jinja2>=3.1.0",
]

[project.scripts]
publichost = "publichost.tunnel.__main__:main"
publichost-api = "publichost.api.cli:run_api"
publichost-worker = "publichost.api.cli:run_worker"
publichost-beat = "publichost.api.cli:run_beat"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/publichost"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
